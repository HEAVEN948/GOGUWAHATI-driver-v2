<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GG Partner">
<meta name="theme-color" content="#F2B705">
<style>
  :root {
    --purple-deep: #241436;
    --purple: #6D3FC7;
    --purple-light: #9B7FE8;
    --gold: #F2B705;
    --river: #3E8FB0;
    --bg: #0A0A0C;
    --card-bg: #17151C;
    --card-border: #2A2732;
    --text: #F2F0F7;
    --text-muted: #9A96A8;
    --danger: #E24C4B;
    --success: #2AAE6C;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Inter', -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding-bottom: 76px;
  }
  h1, h2, h3, .brand-font { font-family: 'Poppins', sans-serif; }

  /* ===== HERO / SKYLINE BANNER ===== */
  .hero {
    position: relative;
    background: linear-gradient(180deg, var(--purple-deep) 0%, var(--purple) 100%);
    color: #fff;
    padding: 18px 20px 60px;
    overflow: hidden;
  }
  .hero-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .brand-row { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 15px; letter-spacing: 0.5px; }
  .brand-row svg { width: 26px; height: 26px; }
  .hero-status { font-family: 'Poppins', sans-serif; font-weight: 700; font-size: 24px; margin-top: 6px; }
  .hero-sub { font-size: 13px; opacity: 0.8; margin-top: 2px; }
  .skyline { position: absolute; bottom: 0; left: 0; width: 100%; height: 70px; z-index: 0; }
  .hero-content { position: relative; z-index: 1; }

  main { max-width: 480px; margin: 0 auto; padding: 0 16px; }
  .card {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 14px;
    padding: 18px;
    margin-top: -34px;
    margin-bottom: 14px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.35);
    position: relative;
    z-index: 2;
  }
  .card.tight { margin-top: 14px; }
  .pill-btn {
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: 30px;
    font-weight: 700;
    font-size: 16px;
    cursor: pointer;
    font-family: 'Poppins', sans-serif;
  }
  .btn-purple { background: var(--purple); color: #fff; }
  .btn-gold { background: var(--gold); color: var(--purple-deep); }
  .btn-outline { background: transparent; border: 2px solid var(--purple-light); color: var(--purple-light); }
  .btn-danger { background: var(--danger); color: #fff; }
  .btn-flat { background: #2A2440; color: var(--purple-light); }
  button { font-family: inherit; }

  .pass-card { display: flex; justify-content: space-between; align-items: center; }
  .pass-badge {
    display: inline-block; padding: 3px 10px; border-radius: 10px;
    font-size: 11px; font-weight: 700; text-transform: uppercase;
  }
  .pass-active { background: #E3F7EC; color: var(--success); }
  .pass-expired { background: #FDEAEA; color: var(--danger); }

  label { display: block; font-size: 13px; font-weight: 600; color: var(--text-muted); margin: 12px 0 6px; }
  label:first-child { margin-top: 0; }
  input, select {

// ================= SOUND ALERTS (Web Audio, no files needed) =================
// IMPORTANT: browsers block audio from playing unless it was started as a
// direct result of a user tap/click. A new-ride event arriving later from
// Firebase does NOT count as a tap, so without "unlocking" the AudioContext
// during an actual tap first, playNewRequestSound() plays silently.
// audioUnlocked / unlockAudio() fix that by creating + resuming the context
// the moment the driver taps something (login, go online, anywhere on screen).
let audioCtx;
let audioUnlocked = false;
function getCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}
function unlockAudio() {
  if (audioUnlocked) return;
  const ctx = getCtx();
  if (ctx.state === 'suspended') ctx.resume();
  // Play a near-silent blip so iOS/Android fully commits the unlock.
  playTone(440, 0.01, 0);
  audioUnlocked = true;
}
function playTone(freq, duration, delay, type='sine') {
  const ctx = getCtx();
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = type;
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(0.001, ctx.currentTime + delay);
  gain.gain.linearRampToValueAtTime(0.3, ctx.currentTime + delay + 0.02);
  gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + delay + duration);
  osc.connect(gain);
  gain.connect(ctx.destination);
  osc.start(ctx.currentTime + delay);
  osc.stop(ctx.currentTime + delay + duration + 0.05);
}
function playNewRequestSound() {
  playTone(880, 0.18, 0);
  playTone(1046, 0.22, 0.22);
  playTone(880, 0.18, 0.55);

}

// ================= IDLE-ONLINE LOCATION (for nearby-first matching) =================
// While online and waiting for requests (not yet on a ride), this quietly
// tracks the driver's own current position on-device only — nothing is
// written to Firebase here, it's just used locally to sort/filter the
// incoming request list so nearby pickups surface first. Free (built-in
// GPS), starts the moment the driver goes online, stops the moment they go
// offline.
let myLat = null, myLng = null;
let idleLocationWatchId = null;
function startIdleLocationWatch() {
  if (idleLocationWatchId !== null || !navigator.geolocation) return;
  idleLocationWatchId = navigator.geolocation.watchPosition(pos => {
    myLat = pos.coords.latitude;
    myLng = pos.coords.longitude;
    if (isOnline && !activeRideId) renderRequests(lastKnownRequests);
  }, err => console.warn('Idle location watch error:', err.message), {
    enableHighAccuracy: true, maximumAge: 15000, timeout: 20000
  });
}
function stopIdleLocationWatch() {
  if (idleLocationWatchId !== null) {
    navigator.geolocation.clearWatch(idleLocationWatchId);
    idleLocationWatchId = null;
  }
  myLat = null; myLng = null;
}
function haversineKm(lat1, lon1, lat2, lon2) {
  const R = 6371;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dLat / 2) ** 2 + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon / 2) ** 2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

// Ringtone-style repeat: keeps beeping every few seconds while there is at
// least one un-responded incoming request, so a booking is never missed.
let requestRingInterval = null;
function startRequestRing() {
  if (requestRingInterval) return;
  playNewRequestSound();
  requestRingInterval = setInterval(() => {
    if (!isOnline || activeRideId || knownRequestIds.size === 0) {
      stopRequestRing();
      return;
    }
    playNewRequestSound();
  }, 4000);
}
function stopRequestRing() {
  if (requestRingInterval) { clearInterval(requestRingInterval); requestRingInterval = null; }
}

      registeredAt: Date.now()
    });

}

// Resize + compress an uploaded image client-side before storing as base64
function compressImage(file, maxSize, quality, callback) {
  const reader = new FileReader();
  reader.onload = e => {
    const img = new Image();
    img.onload = () => {
      let w = img.width, h = img.height;
      if (w > h && w > maxSize) { h *= maxSize / w; w = maxSize; }
      else if (h > maxSize) { w *= maxSize / h; h = maxSize; }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      callback(canvas.toDataURL('image/jpeg', quality));
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

// ================= INCOMING REQUESTS =================
function listenForRequests() {
  const list = document.getElementById('requestsList');
  if (!list) return;
  db.ref('rideRequests').orderByChild('status').equalTo('requested')
    .on('value', snapshot => {
      if (!isOnline || activeRideId) return;
      const requests = snapshot.val();
      const ids = requests ? Object.keys(requests) : [];

      if (!firstRequestsLoad) {
        const newOnes = ids.filter(id => !knownRequestIds.has(id));
        if (newOnes.length > 0) startRequestRing();
      }
      knownRequestIds = new Set(ids);
      if (ids.length === 0) stopRequestRing();
      firstRequestsLoad = false;

      lastKnownRequests = requests;
      renderRequests(requests);
    }, err => console.error("Listen error:", err));
}

// Sorts incoming requests by distance from the driver's current location
// (nearest first) and prefers ones within 5km. If NONE are within 5km,
// falls back to showing all of them anyway (nearest-first) rather than
// hiding bookings just because no one happens to be close — a farther
// driver is better than no driver.
function sortAndFilterByProximity(entries) {
  if (myLat === null || myLng === null) return entries; // no GPS fix yet — show everything, unsorted
  const withDist = entries.map(([id, r]) => {
    const dist = (r.pickupLat && r.pickupLng) ? haversineKm(myLat, myLng, r.pickupLat, r.pickupLng) : null;
    return [id, r, dist];
  });
  withDist.sort((a, b) => {
    if (a[2] === null) return 1;
    if (b[2] === null) return -1;
    return a[2] - b[2];
  });
  const within5km = withDist.filter(([, , dist]) => dist !== null && dist <= 5);
  const chosen = within5km.length > 0 ? within5km : withDist;
  return chosen.map(([id, r, dist]) => [id, r, dist]);
}

// Only show requests for the vehicle type this driver actually registered
// (Bike/Auto/Car) — a bike request shouldn't go to a car driver and vice
// versa. Older requests booked before this feature existed have no
// vehicleType saved at all, so those are shown to everyone rather than
// disappearing for existing/legacy bookings.
function filterByVehicleType(entries) {
  if (!driverProfile || !driverProfile.vehicleType) return entries;
  return entries.filter(([, r]) => !r.vehicleType || r.vehicleType === driverProfile.vehicleType);
}

function renderRequests(requests) {
  const list = document.getElementById('requestsList');
  if (!list) return;

  // Detach any per-card "did this get cancelled?" listeners from the
  // previous render before rebuilding, so they don't pile up over time.
  activeCardStatusRefs.forEach(ref => ref.off());
  activeCardStatusRefs = [];

  if (!requests) {
    list.innerHTML = '<div class="empty-state">No requests right now</div>';
    return;
  }
  const matchingType = filterByVehicleType(Object.entries(requests));
  const sorted = sortAndFilterByProximity(matchingType);
  if (sorted.length === 0) {
    list.innerHTML = '<div class="empty-state">No requests right now</div>';
    return;
  }
  list.innerHTML = '';
  sorted.forEach(([id, r, dist]) => {
    const myOffer = r.offers && r.offers[driverId];
    const card = document.createElement('div');
    card.className = 'req-card';
    card.dataset.id = id;

    let actionHtml;
    if (myOffer && myOffer.status === 'rejected') {
      actionHtml = `<div style="color:#999; font-size:13px; padding:8px 0;">Your offer was declined</div>`;
    } else if (myOffer && myOffer.status === 'pending' && myOffer.proposedBy === 'driver') {
      actionHtml = `<div style="color:#888; font-size:13px; padding:8px 0;">Waiting for rider's response on your ₹${myOffer.amount} offer…</div>`;
    } else if (myOffer && myOffer.status === 'pending' && myOffer.proposedBy === 'rider') {
      actionHtml = `
        <div style="background:#2A2440; border-radius:8px; padding:10px; margin-bottom:10px; font-size:13px; color:var(--text);">
          Rider countered: <strong>₹${myOffer.amount}</strong>
        </div>
        <div class="btn-row">
          <button style="background:#2A2732; color:#D6D2E0;" onclick="declineOffer('${id}')">Decline</button>
          <button style="background:var(--purple); color:#fff;" onclick="acceptAtAmount('${id}', ${myOffer.amount})">Accept ₹${myOffer.amount}</button>
        </div>
        <button style="width:100%; margin-top:8px; background:#2A2440; color:var(--purple-light); border:none; padding:10px; border-radius:8px; font-weight:600;" onclick="openCounterInput('${id}', this)">Counter Again</button>
      `;
    } else {
      actionHtml = `
        <div class="btn-row">
          <button style="background:#2A2732; color:#D6D2E0;" onclick="this.closest('.req-card').remove()">Skip</button>
          <button style="background:var(--purple); color:#fff;" onclick="acceptAtAmount('${id}', ${r.fareOffer})">Accept ₹${r.fareOffer}</button>
        </div>
        <button style="width:100%; margin-top:8px; background:#2A2440; color:var(--purple-light); border:none; padding:10px; border-radius:8px; font-weight:600;" onclick="openCounterInput('${id}', this)">Counter Offer</button>
      `;
    }

    const distLabel = dist !== null && dist !== undefined
      ? `<span style="color:var(--gold); font-weight:700;">${dist < 1 ? Math.round(dist * 1000) + 'm' : dist.toFixed(1) + 'km'} away</span> · `
      : '';
    const vehicleIcon = { Bike: '🏍️', Auto: '🛺', Car: '🚗' }[r.vehicleType] || '';

    const stopsHtml = (r.stops && r.stops.length)
      ? r.stops.map(s => `<span class="dot" style="background:var(--river);"></span>${s.label}<br>`).join('')
      : '';

    card.innerHTML = `
      <div class="req-top">
        <span>${distLabel}${r.riderName || 'Rider'}${vehicleIcon ? ' · ' + vehicleIcon : ''}</span>
        <span class="req-fare">₹${r.fareOffer || '—'}</span>
      </div>
      <div class="req-route">
        <span class="dot pickup-dot"></span>${r.pickup}<br>
        ${stopsHtml}
        <span class="dot drop-dot"></span>${r.destination}
      </div>
      <div class="reqActions">${actionHtml}</div>
    `;
    list.appendChild(card);

    // Real-time safety net: the moment this specific request's status
    // changes away from "requested" — cancelled by the rider, or accepted
    // by another driver — remove its card immediately, independent of
    // whatever the top-level list query does. Guarantees a cancelled ride
    // never lingers on screen.
    const statusRef = db.ref('rideRequests/' + id + '/status');
    statusRef.on('value', snap => {
      if (snap.val() !== 'requested') {
        statusRef.off();
        const el = list.querySelector(`.req-card[data-id="${id}"]`);
        if (el) el.remove();
      }
    });
    activeCardStatusRefs.push(statusRef);
  });
}

function submitCounter(id) {
  const input = document.getElementById('counterInput-' + id);
  const amount = parseFloat(input.value);
  if (!amount || amount <= 0) { alert('Enter a valid amount.'); return; }
  db.ref(`rideRequests/${id}/offers/${driverId}`).set({
    driverName: driverProfile.name, driverPhone: driverProfile.phone, driverVehicle: driverProfile.vehicle,
    amount, proposedBy: 'driver', status: 'pending', updatedAt: Date.now()
  });
}

function declineOffer(id) {
  db.ref(`rideRequests/${id}/offers/${driverId}`).update({ status: 'rejected', updatedAt: Date.now() });
}

function acceptAtAmount(id, amount) {
  stopRequestRing();
  db.ref('rideRequests/' + id).transaction(current => {
    if (current && current.status === 'requested') {
      current.status = 'accepted';
      current.driverId = driverId;
      current.driverName = driverProfile.name;
      current.driverPhone = driverProfile.phone;
      current.driverVehicle = driverProfile.vehicle;
      current.agreedFare = amount;
      current.acceptedAt = Date.now();
      return current;
    }
    return current;
  }, (error, committed, snapshot) => {
    if (committed && snapshot.val().driverId === driverId) {
      activeRideId = id;
      localStorage.setItem('gg_activeRideId', id);
      renderHome();
    } else {
      alert('This ride was just taken by another driver.');
    }
  });
}

// ================= ACTIVE RIDE =================
let chatNotifyRideId = null;
let chatNotifyMsgCount = 0;

function watchActiveRide(id) {
  db.ref('rideRequests/' + id).on('value', snapshot => {
    const ride = snapshot.val();
    const section = document.getElementById('activeRideSection');
    if (!section) return;

    if (!ride || ride.status === 'completed' || ride.status === 'cancelled') {
      if (ride && ride.status === 'cancelled' && ride.cancelledBy !== driverId) {
        playCancelSound();
      }
      stopChatNotifications();
      stopLocationSharing();
      activeRideId = null;
      localStorage.removeItem('gg_activeRideId');
      renderHome();
      return;
    }
    startChatNotifications(id);
    startLocationSharing(id);
    renderActiveRide(id, ride);
  });
}

// ================= LIVE LOCATION SHARING =================
// While a ride is accepted or in progress, continuously (but not too
// frequently — every ~6 seconds) writes the driver's GPS position to this
// ride's record, so the rider can see a live distance readout and open a
// map showing exactly where the driver currently is. Free — just the
// browser's built-in GPS, no maps API involved. Stops automatically the
// moment the ride ends, and only runs while this app is open (same as any
// web app — GPS can't be read once the app is fully closed).
let locationWatchId = null;
let locationSharingRideId = null;
let lastLocationWriteAt = 0;

function startLocationSharing(id) {
  if (locationSharingRideId === id) return; // already sharing for this ride
  stopLocationSharing();
  if (!navigator.geolocation) return;
  locationSharingRideId = id;
  locationWatchId = navigator.geolocation.watchPosition(pos => {
    const now = Date.now();
    if (now - lastLocationWriteAt < 6000) return; // throttle writes
    lastLocationWriteAt = now;
    db.ref('rideRequests/' + id).update({
      driverLiveLat: pos.coords.latitude,
      driverLiveLng: pos.coords.longitude,
      driverLiveUpdatedAt: now
    });
  }, err => console.warn('Location watch error:', err.message), {
    enableHighAccuracy: true, maximumAge: 5000, timeout: 15000
  });
}
function stopLocationSharing() {
  if (locationWatchId !== null) {
    navigator.geolocation.clearWatch(locationWatchId);
    locationWatchId = null;
  }
  locationSharingRideId = null;
}

// Plays a short alert whenever the rider sends a new chat message, even if
// the chat window isn't currently open, so a driver never misses "where are
// you" type messages while focused on driving.
function startChatNotifications(id) {
  if (chatNotifyRideId === id) return; // already listening to this ride
  stopChatNotifications();
  chatNotifyRideId = id;
  chatNotifyMsgCount = 0;
  let firstLoad = true;
  db.ref('rideRequests/' + id + '/messages').on('value', snap => {
    const msgs = snap.val() || {};
    const list = Object.values(msgs).sort((a, b) => a.ts - b.ts);
    if (!firstLoad && list.length > chatNotifyMsgCount) {
      const newest = list[list.length - 1];
      if (newest.sender !== 'driver') playChatMessageSound();
    }
    chatNotifyMsgCount = list.length;
    firstLoad = false;
  });
}
function stopChatNotifications() {
  if (chatNotifyRideId) { db.ref('rideRequests/' + chatNotifyRideId + '/messages').off(); chatNotifyRideId = null; }
}

function renderActiveRide(id, ride) {
  const section = document.getElementById('activeRideSection');
  if (!section) return;

  // While riding to pickup, "Open in Maps" points at the pickup location.
  // The instant the driver taps "Mark Picked Up", updateRideStatus() flips
  // ride.status to in_progress and this function re-renders (live Firebase
  // listener above), so the very next render automatically swaps this link
  // to point at the destination instead — no extra search needed.
  const destinationPhase = ride.status === 'in_progress' || ride.status === 'completed';
  const mapsLink = destinationPhase
    ? ((ride.destinationLat && ride.destinationLng)
        ? `https://www.google.com/maps/search/?api=1&query=${ride.destinationLat},${ride.destinationLng}`
        : `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(ride.destination)}`)
    : ((ride.pickupLat && ride.pickupLng)
        ? `https://www.google.com/maps/search/?api=1&query=${ride.pickupLat},${ride.pickupLng}`
        : `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(ride.pickup)}`);
  const mapsLabel = destinationPhase ? '📍 Navigate to Drop-off' : '📍 Navigate to Pickup';

  // "Mark Picked Up" now requires the driver to enter the OTP the rider
  // reads out to them in person — confirms it's genuinely the matched
  // rider, not a mix-up. Legacy rides booked before this feature (no OTP
  // saved) skip straight through instead of getting permanently stuck.
  const nextAction = ride.status === 'accepted'
    ? (ride.otp
        ? `<button class="pill-btn btn-purple" onclick="openOtpModal('${id}','${ride.otp}')">Mark Picked Up</button>`
        : `<button class="pill-btn btn-purple" onclick="updateRideStatus('${id}','in_progress')">Mark Picked Up</button>`)
    : ride.status === 'in_progress'
    ? `<button class="pill-btn btn-purple" onclick="updateRideStatus('${id}','completed')">Complete Ride</button>`
    : '';

  const activeStopsHtml = (ride.stops && ride.stops.length)
    ? ride.stops.map(s => `<span class="dot" style="background:var(--river);"></span>${s.label}<br>`).join('')
    : '';

  section.innerHTML = `
    <div class="card tight">
      <span class="status-badge">${ride.status.replace('_',' ')}</span>
      <div style="font-weight:700; font-size:16px;">${ride.riderName}</div>
      <div class="req-route">
        <span class="dot pickup-dot"></span>${ride.pickup}<br>
        ${activeStopsHtml}
        <span class="dot drop-dot"></span>${ride.destination}
      </div>
      <div class="req-fare">₹${ride.agreedFare || ride.fareOffer}</div>
      <div class="action-grid">
        <a href="tel:${ride.riderPhone}" class="btn-call">📞 Call</a>
        <a href="https://wa.me/${ride.riderPhone}" target="_blank" class="btn-wa">💬 WhatsApp</a>
        <a href="${mapsLink}" target="_blank" class="btn-map">${mapsLabel}</a>
        <button class="btn-cancel" onclick="openCancelModal('${id}')">✕ Cancel Ride</button>
      </div>
      <button onclick="openChatModal('${id}','driver','${ride.riderName}')" style="width:100%; margin-top:10px; padding:11px; border-radius:8px; border:none; background:var(--purple); color:#fff; font-weight:700; font-size:14px;">💬 Chat with Rider</button>
      <div style="margin-top:12px;">${nextAction}</div>
    </div>
  `;
}

function updateRideStatus(id, status) {
  db.ref('rideRequests/' + id).update({ status, [status + 'At']: Date.now() });
}

// ================= OTP VERIFICATION (pickup confirmation) =================
function openOtpModal(id, expectedOtp) {
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `

      <h3>Enter Pickup OTP</h3>
      <div style="font-size:13px; color:var(--text-muted); margin-bottom:14px; line-height:1.5;">Ask the rider for their 4-digit OTP to confirm you have the right passenger before starting the ride.</div>
      <input id="otpInput" type="tel" inputmode="numeric" maxlength="4" placeholder="4-digit OTP" style="text-align:center; font-size:24px; letter-spacing:10px; font-weight:700;">
      <div id="otpError" style="color:var(--danger); font-size:13px; margin-top:8px; text-align:center; min-height:18px;"></div>
      <button class="pill-btn btn-purple" id="btnConfirmOtp" style="margin-top:12px;">Confirm &amp; Start Ride</button>
      <button class="reason-option" style="text-align:center; color:#999; border:none; margin-top:10px;" id="btnCancelOtp">Never mind</button>
    </div>`;
  document.body.appendChild(overlay);
  const input = overlay.querySelector('#otpInput');

    }
  });
  overlay.querySelector('#btnCancelOtp').addEventListener('click', () => overlay.remove());
}

    msgsContainer.innerHTML = sorted.length
      ? sorted.map(m => renderChatBubble(m, myRole)).join('')
      : '<div style="text-align:center; color:var(--text-muted); font-size:13px; padding:24px 10px;">No messages yet — say hello, or share your location if there\'s any confusion finding each other.</div>';
    msgsContainer.scrollTop = msgsContainer.scrollHeight;
  });

  function sendChatMessage(text, mapsLink) {
    if (!text && !mapsLink) return;
    activeChatMsgsRef.push({ sender: myRole, text: text || '', mapsLink: mapsLink || null, ts: Date.now() });
  }

  overlay.querySelector('#btnSendChat').addEventListener('click', () => {
    const inputEl = overlay.querySelector('#chatInput');
    const text = inputEl.value.trim();
    if (text) { sendChatMessage(text); inputEl.value = ''; }
  });
  overlay.querySelector('#chatInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') overlay.querySelector('#btnSendChat').click();
  });
  overlay.querySelector('#btnShareChatLocation').addEventListener('click', () => {
    if (!navigator.geolocation) { alert('GPS not supported on this device/browser.'); return; }
    navigator.geolocation.getCurrentPosition(pos => {
      const link = `https://www.google.com/maps?q=${pos.coords.latitude},${pos.coords.longitude}`;
      sendChatMessage('📍 Shared current location', link);
    }, () => alert('Could not get your current location. Please check location permission.'));
  });
  overlay.querySelector('#btnCloseChat').addEventListener('click', () => {
    if (activeChatMsgsRef) { activeChatMsgsRef.off(); activeChatMsgsRef = null; }
    overlay.remove();
  });
}

function renderChatBubble(m, myRole) {
  const isMine = m.sender === myRole;
  const bubbleBg = isMine ? 'var(--purple)' : '#2A2440';
  const textColor = '#fff';
  const linkColor = isMine ? '#fff' : 'var(--purple-light)';
  const linkHtml = m.mapsLink ? `<br><a href="${m.mapsLink}" target="_blank" style="color:${linkColor}; text-decoration:underline; font-weight:700;">Open in Google Maps</a>` : '';
  const safeText = (m.text || '').replace(/</g, '&lt;');
  return `<div style="align-self:${isMine ? 'flex-end' : 'flex-start'}; max-width:80%; background:${bubbleBg}; color:${textColor}; padding:9px 13px; border-radius:14px; font-size:14px; line-height:1.4;">${safeText}${linkHtml}</div>`;
}
function openCancelModal(id) {
  const reasons = ['Passenger not reachable', 'Passenger cancelled verbally', 'Fake booking', 'Other'];
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal-sheet">
      <h3>Why are you cancelling?</h3>
      ${reasons.map(r => `<button class="reason-option" data-reason="${r}">${r}</button>`).join('')}
      <button class="reason-option" style="text-align:center; color:#999; border:none;" id="btnCloseModal">Never mind</button>
    </div>
  `;
  document.body.appendChild(overlay);
  overlay.querySelectorAll('[data-reason]').forEach(btn => {
    btn.addEventListener('click', () => {
      db.ref('rideRequests/' + id).update({
        status: 'cancelled',
        cancelReason: btn.dataset.reason,
        cancelledBy: driverId,
        cancelledAt: Date.now()
      });
      overlay.remove();
    });
  });
  document.getElementById('btnCloseModal').addEventListener('click', () => overlay.remove());
}

// ================= EARNINGS TAB =================
function renderEarnings() {
  tabEarnings.innerHTML = `<div class="card tight"><div class="empty-state">Loading earnings…</div></div>`;
  db.ref('rideRequests').orderByChild('driverId').equalTo(driverId).once('value', snapshot => {
    const all = snapshot.val() || {};
    const completed = Object.values(all).filter(r => r.status === 'completed');
    const todayStart = new Date(); todayStart.setHours(0,0,0,0);
    const todayRides = completed.filter(r => (r.completedAt || 0) >= todayStart.getTime());
    const fareOf = r => parseFloat(r.agreedFare || r.fareOffer) || 0;
    const todayTotal = todayRides.reduce((sum, r) => sum + fareOf(r), 0);
    const allTotal = completed.reduce((sum, r) => sum + fareOf(r), 0);

    const sorted = completed.sort((a,b) => (b.completedAt||0) - (a.completedAt||0)).slice(0, 15);

    tabEarnings.innerHTML = `
      <div class="card tight">
        <div style="font-size:13px; color:#888;">Today</div>
        <div style="font-family:'Poppins',sans-serif; font-weight:700; font-size:28px; color:var(--purple);">₹${todayTotal}</div>
        <div style="font-size:13px; color:#888; margin-top:2px;">${todayRides.length} ride${todayRides.length !== 1 ? 's' : ''} completed</div>
      </div>
      <div class="card tight">
        <div style="font-size:13px; color:#888;">All-time total</div>
        <div style="font-family:'Poppins',sans-serif; font-weight:700; font-size:22px;">₹${allTotal}</div>
        <div style="font-size:13px; color:#888; margin-top:2px;">${completed.length} total rides</div>
      </div>
      <div class="section-title">Recent Trips</div>
      <div class="card tight">
        ${sorted.length === 0 ? '<div class="empty-state">No completed rides yet</div>' :
          sorted.map(r => `
            <div class="trip-row">
              <div>
                <div style="font-weight:600;">${r.riderName || 'Rider'}</div>
                <div style="color:#999; font-size:12px;">${r.pickup} → ${r.destination}</div>
              </div>
              <div style="font-weight:700; color:var(--purple);">₹${r.agreedFare || r.fareOffer}</div>
            </div>
          `).join('')
        }
      </div>
    `;
  });
}

// ================= MENU TAB =================
function renderMenu() {
  if (!driverProfile) {
    tabMenu.innerHTML = `<div class="card tight empty-state">Complete registration first</div>`;
    return;
  }
  const passActive = isPassActive();
  const passInfo = passActive
    ? `<span class="pass-badge pass-active">Active</span> · expires ${new Date(driverProfile.passExpiresAt).toLocaleString('en-IN', {hour:'2-digit', minute:'2-digit', day:'2-digit', month:'short'})}`
    : `<span class="pass-badge pass-expired">Expired</span>`;

  const upiLink = `upi://pay?pa=${UPI_ID}&pn=GOGUWAHATI&am=${PASS_AMOUNT}&cu=INR&tn=DailyPass`;
  const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=${encodeURIComponent(upiLink)}`;

  const passSectionHtml = FREE_LAUNCH_MODE
    ? `<div class="card tight">
         <div style="font-weight:700;">🎉 Free Launch Period</div>
         <div style="font-size:13px; color:#888; margin-top:8px; line-height:1.6;">All rides are free to accept right now while we're just getting started — no daily pass needed. We'll give you notice before any charges begin.</div>
       </div>`
    : `<div class="card tight">
         <div style="font-weight:700;">Daily Pass — ₹${PASS_AMOUNT}/24hr</div>
         <div style="font-size:13px; color:#888; margin:6px 0 12px;">${passInfo}</div>
         <div class="qr-box"><img src="${qrUrl}" alt="UPI QR Code"></div>
         <div class="upi-id-box">${UPI_ID}</div>
         <label>Transaction Reference <span style="color:var(--text-muted); font-weight:400;">(optional — helps us confirm faster)</span></label>
         <input id="txnRef" type="text" placeholder="e.g. 123456789012">
         <button class="pill-btn btn-gold" style="margin-top:12px;" id="btnSubmitRecharge">✅ I've Paid ₹${PASS_AMOUNT}</button>
         <div style="font-size:12px; color:#999; margin-top:8px; text-align:center;">We'll confirm your payment and activate your pass shortly.</div>
       </div>`;

  tabMenu.innerHTML = `
    <div class="card tight" style="display:flex; gap:14px; align-items:center;">
      ${driverProfile.photoBase64 ? `<img src="${driverProfile.photoBase64}" style="width:60px; height:60px; border-radius:50%; object-fit:cover;">` : `<div style="width:60px; height:60px; border-radius:50%; background:#2A2440; display:flex; align-items:center; justify-content:center; font-weight:700; color:var(--purple-light); font-size:22px;">${driverProfile.name.charAt(0)}</div>`}
      <div>
        <div style="font-weight:700; font-size:16px;">${driverProfile.name}</div>
        <div style="font-size:13px; color:#888; margin-top:2px;">${driverProfile.phone}</div>
        <div style="font-size:13px; color:#888;">${driverProfile.vehicle} · ${driverProfile.vehicleType}</div>
        <div style="margin-top:6px;">${isVerified() ? '<span class="pass-badge pass-active">Verified</span>' : '<span class="pass-badge pass-expired">Not Verified</span>'}</div>
      </div>
    </div>

    ${passSectionHtml}

    <div class="card tight">
      <button class="pill-btn btn-outline" id="btnInstallMenu">📲 Install App</button>
      <button class="pill-btn btn-flat" style="margin-top:10px;" id="btnShareMenu">🔗 Share App</button>
      <div id="iosInstallNote"></div>
    </div>

    <div class="card tight">
      <button class="pill-btn btn-flat" id="btnLogoutDriver">Logout</button>
    </div>

    <div class="credit-line">GOGUWAHATI by Marak Innovation</div>
  `;

  document.getElementById('btnLogoutDriver').addEventListener('click', () => {
    if (confirm('Logout of your driver account?')) auth.signOut();
  });

  if (!FREE_LAUNCH_MODE) {
    document.getElementById('btnSubmitRecharge').addEventListener('click', () => {
      const txn = document.getElementById('txnRef').value.trim();
      db.ref('rechargeRequests').push({
        driverId, driverName: driverProfile.name, driverPhone: driverProfile.phone,
        amount: PASS_AMOUNT, txnRef: txn || null, status: 'pending', submittedAt: Date.now()
      }).then(() => {
        alert('Thanks! Your pass will be activated once your payment is confirmed.');
        document.getElementById('txnRef').value = '';
      });
    });
  }

  setupInstallShare('btnInstallMenu', 'btnShareMenu', 'iosInstallNote');
}

// ================= INSTALL / SHARE =================
let deferredInstallPrompt = null;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredInstallPrompt = e;
  showAndroidInstallBannerIfNeeded();
});

// Auto-appearing install banner for Android — shows the instant Chrome
// signals the app is installable (e.g., right after scanning the QR code),
// instead of requiring someone to dig through the header or Menu tab to
// find the Install button themselves.
function showAndroidInstallBannerIfNeeded() {
  if (!deferredInstallPrompt) return;
  if (localStorage.getItem('gg_android_banner_dismissed') === 'true') return;
  if (document.getElementById('androidInstallBanner')) return;

  const banner = document.createElement('div');
  banner.id = 'androidInstallBanner';
  banner.style.cssText = 'position:fixed; left:12px; right:12px; bottom:86px; z-index:500; background:var(--card-bg); border:1px solid var(--card-border); color:var(--text); border-radius:14px; padding:14px 16px; box-shadow:0 6px 20px rgba(0,0,0,0.4); font-size:13px; line-height:1.5; display:flex; gap:10px; align-items:center;';
  banner.innerHTML = `
    <div style="flex:1;"><strong>Install GOGUWAHATI Partner</strong><br>Get it on your home screen — one tap.</div>
    <button id="btnAndroidBannerInstall" style="background:var(--gold); color:var(--purple-deep); border:none; padding:9px 16px; border-radius:20px; font-weight:700; font-size:13px; white-space:nowrap;">Install</button>
    <button id="btnDismissAndroidBanner" style="background:none; border:none; color:var(--purple-light); font-size:19px; line-height:1; padding:0;">✕</button>
  `;
  document.body.appendChild(banner);
  document.getElementById('btnAndroidBannerInstall').addEventListener('click', async () => {
    banner.remove();
    if (deferredInstallPrompt) {
      deferredInstallPrompt.prompt();
      await deferredInstallPrompt.userChoice;
      deferredInstallPrompt = null;
    }
  });
  document.getElementById('btnDismissAndroidBanner').addEventListener('click', () => {
    banner.remove();
    localStorage.setItem('gg_android_banner_dismissed', 'true');
  });
}

function isIOS() {
  return /iPad|iPhone|iPod/.test(navigator.userAgent);
}

// ================= AUTO IOS INSTALL BANNER =================
// Detects an iPhone/iPad visitor automatically (no need to tap Install
// first) and shows exact instructions — including the tricky case where
// they're using Chrome or Firefox on iOS, where "Add to Home Screen" isn't
// available at all; only Safari can install web apps on iOS.
function isInStandaloneMode() {
  return window.navigator.standalone === true || window.matchMedia('(display-mode: standalone)').matches;
}
function isIOSNonSafariBrowser() {
  return /CriOS|FxiOS|EdgiOS|OPiOS/.test(navigator.userAgent);
}
function showIOSInstallBannerIfNeeded() {
  if (!isIOS() || isInStandaloneMode()) return;
  if (localStorage.getItem('gg_ios_banner_dismissed') === 'true') return;

  const msg = isIOSNonSafariBrowser()
    ? `<strong>To install:</strong> iPhone only allows installing apps from <strong>Safari</strong>. Copy this link and open it in Safari, then tap Share → "Add to Home Screen".`
    : `<strong>To install:</strong> Tap the <strong>Share</strong> icon in Safari, then scroll down and tap <strong>"Add to Home Screen"</strong>.`;

  const banner = document.createElement('div');
  banner.id = 'iosInstallBanner';
  banner.style.cssText = 'position:fixed; left:12px; right:12px; bottom:86px; z-index:500; background:var(--card-bg); border:1px solid var(--card-border); color:var(--text); border-radius:14px; padding:14px 16px; box-shadow:0 6px 20px rgba(0,0,0,0.4); font-size:13px; line-height:1.5; display:flex; gap:10px; align-items:flex-start;';
  banner.innerHTML = `
    <div style="flex:1;">${msg}</div>
    <button id="btnDismissIOSBanner" style="background:none; border:none; color:var(--purple-light); font-size:19px; line-height:1; padding:0;">✕</button>
  `;
  document.body.appendChild(banner);
  document.getElementById('btnDismissIOSBanner').addEventListener('click', () => {
    banner.remove();
    localStorage.setItem('gg_ios_banner_dismissed', 'true');
  });
}
showIOSInstallBannerIfNeeded();

function setupInstallShare(installBtnId, shareBtnId, noteId) {
  const installBtn = document.getElementById(installBtnId);
  const shareBtn = document.getElementById(shareBtnId);
  const note = document.getElementById(noteId);

  if (isIOS()) {
    if (installBtn) installBtn.style.display = 'none';
    if (note) note.innerHTML = `<div style="font-size:12px; color:#888; margin-top:10px; text-align:center;">On iPhone: tap the Share icon in Safari, then "Add to Home Screen" to install.</div>`;
  } else if (installBtn) {
    installBtn.addEventListener('click', async () => {
      if (deferredInstallPrompt) {
        deferredInstallPrompt.prompt();
        await deferredInstallPrompt.userChoice;
        deferredInstallPrompt = null;
      } else {
        alert('App may already be installed, or your browser does not support one-tap install. Use the browser menu to Add to Home screen.');
      }
    });
  }

  if (shareBtn) {
    shareBtn.addEventListener('click', () => {
      const shareData = { title: 'GOGUWAHATI Driver', text: 'Drive with GOGUWAHATI — join now!', url: window.location.href };
      if (navigator.share) {
        navigator.share(shareData).catch(() => {});
      } else {
        navigator.clipboard.writeText(window.location.href);
        alert('Link copied to clipboard!');
      }
    });
  }
}

// Manifest is now a real static manifest.json file (see repo root) instead
// of being generated here at runtime — that runtime/blob approach was set
// AFTER the page had already loaded, which is very likely why Android was
// treating this as a plain "website shortcut" (Chrome badge overlay)
// instead of a properly installed app with a clean icon.

// ================= SERVICE WORKER =================
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(err => console.error('SW registration failed:', err));
}

// Resume active ride if one exists on load
if (activeRideId) {
  const check = setInterval(() => {
    if (authReady && driverProfile) {
      clearInterval(check);
      switchTab('home');
    }
  }, 200);
}
</script>
