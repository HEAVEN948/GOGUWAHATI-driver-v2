    background: #fff;
    border-radius: 14px;
    padding: 18px;
    margin-top: -34px;
    margin-bottom: 14px;

  .pill-btn {

    border-radius: 30px;

    font-size: 16px;

  .btn-danger { background: var(--danger); color: #fff; }

// ================= SOUND ALERTS (Web Audio, no files needed) =================
let audioCtx;
function getCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}
function playTone(freq, duration, delay, type='sine') {
  const ctx = getCtx();
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = type;
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(0.001, ctx.currentTime + delay);
  gain.gain.linearRampToValueAtTime(0.3, ctx.currentTime + delay + 0.02);
  gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + delay + duration);
  osc.connect(gain);
  gain.connect(ctx.destination);
  osc.start(ctx.currentTime + delay);
  osc.stop(ctx.currentTime + delay + duration + 0.05);
}
function playNewRequestSound() {
  playTone(880, 0.18, 0);
  playTone(1046, 0.22, 0.22);
  playTone(880, 0.18, 0.55);
  playTone(1046, 0.22, 0.77);
}
function playCancelSound() {

}

// ================= TAB SWITCHING =================
function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
  tabHome.style.display = tab === 'home' ? 'block' : 'none';
  tabEarnings.style.display = tab === 'earnings' ? 'block' : 'none';
  tabMenu.style.display = tab === 'menu' ? 'block' : 'none';
  if (tab === 'earnings') renderEarnings();
  if (tab === 'menu') renderMenu();
}

// ================= AUTH (real email/password login) =================
auth.onAuthStateChanged(user => {
  if (user) {
    driverId = user.uid;
    authReady = true;
    authScreen.style.display = 'none';
    appShell.style.display = 'block';
    setupInstallShare('btnInstallHeader', 'btnShareHeader', null);
    loadDriverProfile();
  } else {

    authScreen.style.display = 'block';

});

function showAuthMode(mode) {
  document.getElementById('authLoginForm').style.display = mode === 'login' ? 'block' : 'none';
  document.getElementById('authRegisterForm').style.display = mode === 'register' ? 'block' : 'none';
}

document.getElementById('linkToRegister').addEventListener('click', () => showAuthMode('register'));
document.getElementById('linkToLogin').addEventListener('click', () => showAuthMode('login'));

document.getElementById('btnDoLogin').addEventListener('click', () => {
  const email = document.getElementById('loginEmailInput').value.trim();
  const pass = document.getElementById('loginPassInput').value;
  const errEl = document.getElementById('authError');
  errEl.textContent = '';
  if (!email || !pass) { errEl.textContent = 'Enter email and password.'; return; }
  auth.signInWithEmailAndPassword(email, pass).catch(err => {
    errEl.textContent = err.message;
  });
});

document.getElementById('btnDoRegister').addEventListener('click', () => {
  const email = document.getElementById('regEmailInput').value.trim();
  const pass = document.getElementById('regPassInput').value;
  const errEl = document.getElementById('authError');
  errEl.textContent = '';
  if (!email || pass.length < 6) { errEl.textContent = 'Enter a valid email and a password of at least 6 characters.'; return; }
  auth.createUserWithEmailAndPassword(email, pass).catch(err => {
    errEl.textContent = err.message;
  });
});

document.getElementById('linkForgotPass').addEventListener('click', () => {
  const email = document.getElementById('loginEmailInput').value.trim();
  if (!email) { alert('Enter your email above first, then tap "Forgot password" again.'); return; }

});

function loadDriverProfile() {
  db.ref('drivers/' + driverId).on('value', snapshot => {
    driverProfile = snapshot.val() || null;
    renderHome();
    if (currentTab === 'menu') renderMenu();
  });
}

function isVerified() { return driverProfile && driverProfile.verified === true; }
function isPassActive() { return driverProfile && driverProfile.passExpiresAt && driverProfile.passExpiresAt > Date.now(); }

// ================= HOME TAB =================
function renderHome() {
  if (!authReady) { heroStatus.textContent = 'Connecting…'; return; }

  if (!driverProfile || !driverProfile.name) {
    heroStatus.textContent = 'Welcome!';
    heroSub.textContent = 'Complete your registration to get started';
    renderRegistrationForm();
    return;
  }

  if (driverProfile.blocked === true) {
    heroStatus.textContent = 'Account Suspended';
    heroSub.textContent = 'Your access has been restricted';
    renderBlockedScreen();
    return;
  }

  if (!isVerified()) {
    heroStatus.textContent = 'Verification Pending';
    heroSub.textContent = 'Send your documents to activate your account';
    renderVerificationPending();
    return;
  }

  heroStatus.textContent = isOnline ? 'You are Online' : 'You are Offline';
  heroSub.textContent = isOnline ? 'Waiting for ride requests' : 'Tap below to start accepting rides';
  renderHomeActive();
}

        <img id="photoPreview" src="" style="display:none; width:90px; height:90px; border-radius:50%; object-fit:cover; margin-bottom:8px;">

// Resize + compress an uploaded image client-side before storing as base64
function compressImage(file, maxSize, quality, callback) {
  const reader = new FileReader();
  reader.onload = e => {
    const img = new Image();
    img.onload = () => {
      let w = img.width, h = img.height;
      if (w > h && w > maxSize) { h *= maxSize / w; w = maxSize; }
      else if (h > maxSize) { w *= maxSize / h; h = maxSize; }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      callback(canvas.toDataURL('image/jpeg', quality));
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

      <h3>📋 Documents Required</h3>
      <p>To activate your driver account, send clear photos of the following to our WhatsApp for verification:</p>
      <ul class="doc-list">
        <li>Driving Licence</li>
        <li>Vehicle Insurance</li>
        <li>Fitness Certificate</li>
        <li>Pollution Certificate (PUC)</li>
        <li>Tourist / Commercial Permit</li>
      </ul>
      <a href="https://wa.me/${OWNER_WHATSAPP}?text=${msg}" target="_blank" class="pill-btn btn-gold" style="display:block; text-align:center; text-decoration:none;">Send Documents on WhatsApp</a>
    </div>
    <div class="card tight">
      <div style="font-size:13px; color:#888;">Registered as</div>
      <div style="font-weight:700; margin-top:4px;">${driverProfile.name}</div>
      <div style="font-size:13px; color:#888; margin-top:2px;">${driverProfile.vehicle} · ${driverProfile.vehicleType}</div>
      <div style="margin-top:12px; font-size:13px; color:#999;">We'll review your documents and activate your account. This usually takes a short while — check back soon.</div>
    </div>
  `;
}

function renderHomeActive() {
  const passActive = isPassActive();
  let passHtml = '';
  if (passActive) {
    const hrsLeft = Math.max(0, Math.round((driverProfile.passExpiresAt - Date.now()) / 3600000));
    passHtml = `
      <div class="card tight pass-card">
        <div>
          <span class="pass-badge pass-active">Active</span>
          <div style="font-weight:700; margin-top:6px;">Daily Pass</div>
          <div style="font-size:12px; color:#888;">~${hrsLeft}h remaining</div>
        </div>
        <button class="btn-outline" style="padding:8px 16px; border-radius:20px; font-size:13px; font-weight:600;" onclick="switchTab('menu')">Extend</button>
      </div>
    `;
  } else {
    passHtml = `
      <div class="card tight pass-card">
        <div>
          <span class="pass-badge pass-expired">Expired</span>
          <div style="font-weight:700; margin-top:6px;">Daily Pass</div>
          <div style="font-size:12px; color:#888;">Recharge to accept rides</div>
        </div>
        <button class="btn-gold" style="padding:8px 16px; border-radius:20px; font-size:13px; font-weight:600; border:none;" onclick="switchTab('menu')">Recharge ₹${PASS_AMOUNT}</button>
      </div>
    `;
  }

  let toggleHtml = `<button class="pill-btn ${isOnline ? 'btn-danger' : 'btn-purple'}" id="btnToggle">${isOnline ? 'Go Offline' : 'Go Online'}</button>`;
  if (!passActive) {
    toggleHtml = `<button class="pill-btn btn-flat" disabled style="opacity:0.6;">Recharge pass to go online</button>`;
  }

  tabHome.innerHTML = `
    ${passHtml}
    <div class="card tight">${toggleHtml}</div>
    <div id="activeRideSection"></div>
    <div class="section-title" id="incomingTitle" style="display:none;">Incoming Requests</div>
    <div id="requestsList"></div>
  `;

  const btnToggle = document.getElementById('btnToggle');
  if (btnToggle) {
    btnToggle.addEventListener('click', () => {
      isOnline = !isOnline;
      db.ref('drivers/' + driverId).update({ online: isOnline, lastSeen: Date.now() });
      renderHome();
      if (isOnline && !activeRideId) {
        document.getElementById('incomingTitle').style.display = 'block';
        listenForRequests();
      }
    });
  }

  if (activeRideId) {
    watchActiveRide(activeRideId);
  } else if (isOnline && passActive) {
    document.getElementById('incomingTitle').style.display = 'block';
    listenForRequests();
  }
}

// ================= INCOMING REQUESTS =================
function listenForRequests() {
  const list = document.getElementById('requestsList');
  if (!list) return;
  db.ref('rideRequests').orderByChild('status').equalTo('requested')
    .on('value', snapshot => {
      if (!isOnline || activeRideId) return;
      const requests = snapshot.val();
      const ids = requests ? Object.keys(requests) : [];

      if (!firstRequestsLoad) {
        const newOnes = ids.filter(id => !knownRequestIds.has(id));
        if (newOnes.length > 0) playNewRequestSound();
      }
      knownRequestIds = new Set(ids);
      firstRequestsLoad = false;

      renderRequests(requests);
    }, err => console.error("Listen error:", err));
}

function renderRequests(requests) {
  const list = document.getElementById('requestsList');
  if (!list) return;
  if (!requests) {
    list.innerHTML = '<div class="empty-state">No requests right now</div>';
    return;
  }
  list.innerHTML = '';
  Object.entries(requests).forEach(([id, r]) => {
    const myOffer = r.offers && r.offers[driverId];
    const card = document.createElement('div');
    card.className = 'req-card';

    let actionHtml;
    if (myOffer && myOffer.status === 'rejected') {
      actionHtml = `<div style="color:#999; font-size:13px; padding:8px 0;">Your offer was declined</div>`;
    } else if (myOffer && myOffer.status === 'pending' && myOffer.proposedBy === 'driver') {
      actionHtml = `<div style="color:#888; font-size:13px; padding:8px 0;">Waiting for rider's response on your ₹${myOffer.amount} offer…</div>`;
    } else if (myOffer && myOffer.status === 'pending' && myOffer.proposedBy === 'rider') {
      actionHtml = `
        <div style="background:#F0EBFA; border-radius:8px; padding:10px; margin-bottom:10px; font-size:13px;">
          Rider countered: <strong>₹${myOffer.amount}</strong>
        </div>
        <div class="btn-row">
          <button style="background:#eee; color:#555;" onclick="declineOffer('${id}')">Decline</button>
          <button style="background:var(--purple); color:#fff;" onclick="acceptAtAmount('${id}', ${myOffer.amount})">Accept ₹${myOffer.amount}</button>
        </div>
        <button style="width:100%; margin-top:8px; background:#F0EBFA; color:var(--purple); border:none; padding:10px; border-radius:8px; font-weight:600;" onclick="openCounterInput('${id}', this)">Counter Again</button>
      `;
    } else {
      actionHtml = `
        <div class="btn-row">
          <button style="background:#eee; color:#555;" onclick="this.closest('.req-card').remove()">Skip</button>
          <button style="background:var(--purple); color:#fff;" onclick="acceptAtAmount('${id}', ${r.fareOffer})">Accept ₹${r.fareOffer}</button>
        </div>
        <button style="width:100%; margin-top:8px; background:#F0EBFA; color:var(--purple); border:none; padding:10px; border-radius:8px; font-weight:600;" onclick="openCounterInput('${id}', this)">Counter Offer</button>
      `;
    }

    card.innerHTML = `
      <div class="req-top">
        <span>${r.riderName || 'Rider'}</span>
        <span class="req-fare">₹${r.fareOffer || '—'}</span>
      </div>
      <div class="req-route">
        <span class="dot pickup-dot"></span>${r.pickup}<br>
        <span class="dot drop-dot"></span>${r.destination}
      </div>
      <div class="reqActions">${actionHtml}</div>
    `;
    list.appendChild(card);
  });
}

function openCounterInput(id, btn) {
  const wrap = document.createElement('div');
  wrap.style.marginTop = '8px';
  wrap.innerHTML = `
    <input type="number" placeholder="Your offer (₹)" style="margin-bottom:6px;" id="counterInput-${id}">
    <button style="width:100%; background:var(--gold); color:var(--purple-deep); border:none; padding:10px; border-radius:8px; font-weight:700;" onclick="submitCounter('${id}')">Send Counter Offer</button>
  `;
  btn.replaceWith(wrap);
}

function submitCounter(id) {
  const input = document.getElementById('counterInput-' + id);
  const amount = parseFloat(input.value);
  if (!amount || amount <= 0) { alert('Enter a valid amount.'); return; }
  db.ref(`rideRequests/${id}/offers/${driverId}`).set({
    driverName: driverProfile.name, driverPhone: driverProfile.phone, driverVehicle: driverProfile.vehicle,
    amount, proposedBy: 'driver', status: 'pending', updatedAt: Date.now()
  });
}

function declineOffer(id) {
  db.ref(`rideRequests/${id}/offers/${driverId}`).update({ status: 'rejected', updatedAt: Date.now() });
}

function acceptAtAmount(id, amount) {
  db.ref('rideRequests/' + id).transaction(current => {
    if (current && current.status === 'requested') {
      current.status = 'accepted';
      current.driverId = driverId;
      current.driverName = driverProfile.name;
      current.driverPhone = driverProfile.phone;
      current.driverVehicle = driverProfile.vehicle;
      current.agreedFare = amount;
      current.acceptedAt = Date.now();
      return current;
    }
    return current;
  }, (error, committed, snapshot) => {
    if (committed && snapshot.val().driverId === driverId) {
      activeRideId = id;
      localStorage.setItem('gg_activeRideId', id);
      renderHome();
    } else {
      alert('This ride was just taken by another driver.');
    }
  });
}

// ================= ACTIVE RIDE =================
function watchActiveRide(id) {
  db.ref('rideRequests/' + id).on('value', snapshot => {
    const ride = snapshot.val();
    const section = document.getElementById('activeRideSection');
    if (!section) return;

    if (!ride || ride.status === 'completed' || ride.status === 'cancelled') {
      if (ride && ride.status === 'cancelled' && ride.cancelledBy !== driverId) {
        playCancelSound();
      }
      activeRideId = null;
      localStorage.removeItem('gg_activeRideId');
      renderHome();
      return;
    }
    renderActiveRide(id, ride);
  });
}

function renderActiveRide(id, ride) {
  const section = document.getElementById('activeRideSection');
  if (!section) return;

  const mapsLink = (ride.pickupLat && ride.pickupLng)
    ? `https://www.google.com/maps/search/?api=1&query=${ride.pickupLat},${ride.pickupLng}`
    : `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(ride.pickup)}`;

  const nextAction = ride.status === 'accepted'
    ? `<button class="pill-btn btn-purple" onclick="updateRideStatus('${id}','in_progress')">Mark Picked Up</button>`
    : ride.status === 'in_progress'
    ? `<button class="pill-btn btn-purple" onclick="updateRideStatus('${id}','completed')">Complete Ride</button>`
    : '';

  section.innerHTML = `
    <div class="card tight">
      <span class="status-badge">${ride.status.replace('_',' ')}</span>
      <div style="font-weight:700; font-size:16px;">${ride.riderName}</div>
      <div class="req-route">
        <span class="dot pickup-dot"></span>${ride.pickup}<br>
        <span class="dot drop-dot"></span>${ride.destination}
      </div>
      <div class="req-fare">₹${ride.agreedFare || ride.fareOffer}</div>
      <div class="action-grid">
        <a href="tel:${ride.riderPhone}" class="btn-call">📞 Call</a>
        <a href="https://wa.me/${ride.riderPhone}" target="_blank" class="btn-wa">💬 WhatsApp</a>
        <a href="${mapsLink}" target="_blank" class="btn-map">📍 Open in Maps</a>
        <button class="btn-cancel" onclick="openCancelModal('${id}')">✕ Cancel Ride</button>
      </div>
      <div style="margin-top:12px;">${nextAction}</div>
    </div>
  `;
}

function updateRideStatus(id, status) {
  db.ref('rideRequests/' + id).update({ status, [status + 'At']: Date.now() });
}

// ================= CANCEL MODAL =================
function openCancelModal(id) {
  const reasons = ['Passenger not reachable', 'Passenger cancelled verbally', 'Fake booking', 'Other'];
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal-sheet">
      <h3>Why are you cancelling?</h3>
      ${reasons.map(r => `<button class="reason-option" data-reason="${r}">${r}</button>`).join('')}
      <button class="reason-option" style="text-align:center; color:#999; border:none;" id="btnCloseModal">Never mind</button>
    </div>
  `;
  document.body.appendChild(overlay);
  overlay.querySelectorAll('[data-reason]').forEach(btn => {
    btn.addEventListener('click', () => {
      db.ref('rideRequests/' + id).update({
        status: 'cancelled',
        cancelReason: btn.dataset.reason,
        cancelledBy: driverId,
        cancelledAt: Date.now()
      });
      overlay.remove();
    });
  });
  document.getElementById('btnCloseModal').addEventListener('click', () => overlay.remove());
}

// ================= EARNINGS TAB =================
function renderEarnings() {
  tabEarnings.innerHTML = `<div class="card tight"><div class="empty-state">Loading earnings…</div></div>`;
  db.ref('rideRequests').orderByChild('driverId').equalTo(driverId).once('value', snapshot => {
    const all = snapshot.val() || {};
    const completed = Object.values(all).filter(r => r.status === 'completed');
    const todayStart = new Date(); todayStart.setHours(0,0,0,0);
    const todayRides = completed.filter(r => (r.completedAt || 0) >= todayStart.getTime());
    const fareOf = r => parseFloat(r.agreedFare || r.fareOffer) || 0;
    const todayTotal = todayRides.reduce((sum, r) => sum + fareOf(r), 0);
    const allTotal = completed.reduce((sum, r) => sum + fareOf(r), 0);

    const sorted = completed.sort((a,b) => (b.completedAt||0) - (a.completedAt||0)).slice(0, 15);

    tabEarnings.innerHTML = `
      <div class="card tight">
        <div style="font-size:13px; color:#888;">Today</div>
        <div style="font-family:'Poppins',sans-serif; font-weight:700; font-size:28px; color:var(--purple);">₹${todayTotal}</div>
        <div style="font-size:13px; color:#888; margin-top:2px;">${todayRides.length} ride${todayRides.length !== 1 ? 's' : ''} completed</div>
      </div>
      <div class="card tight">
        <div style="font-size:13px; color:#888;">All-time total</div>
        <div style="font-family:'Poppins',sans-serif; font-weight:700; font-size:22px;">₹${allTotal}</div>
        <div style="font-size:13px; color:#888; margin-top:2px;">${completed.length} total rides</div>
      </div>
      <div class="section-title">Recent Trips</div>
      <div class="card tight">
        ${sorted.length === 0 ? '<div class="empty-state">No completed rides yet</div>' :
          sorted.map(r => `
            <div class="trip-row">
              <div>
                <div style="font-weight:600;">${r.riderName || 'Rider'}</div>
                <div style="color:#999; font-size:12px;">${r.pickup} → ${r.destination}</div>
              </div>
              <div style="font-weight:700; color:var(--purple);">₹${r.agreedFare || r.fareOffer}</div>
            </div>
          `).join('')
        }
      </div>
    `;
  });
}

// ================= MENU TAB =================
function renderMenu() {
  if (!driverProfile) {
    tabMenu.innerHTML = `<div class="card tight empty-state">Complete registration first</div>`;
    return;
  }
  const passActive = isPassActive();
  const passInfo = passActive
    ? `<span class="pass-badge pass-active">Active</span> · expires ${new Date(driverProfile.passExpiresAt).toLocaleString('en-IN', {hour:'2-digit', minute:'2-digit', day:'2-digit', month:'short'})}`
    : `<span class="pass-badge pass-expired">Expired</span>`;

  const upiLink = `upi://pay?pa=${UPI_ID}&pn=GOGUWAHATI&am=${PASS_AMOUNT}&cu=INR&tn=DailyPass`;
  const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=${encodeURIComponent(upiLink)}`;

  tabMenu.innerHTML = `
    <div class="card tight" style="display:flex; gap:14px; align-items:center;">
      ${driverProfile.photoBase64 ? `<img src="${driverProfile.photoBase64}" style="width:60px; height:60px; border-radius:50%; object-fit:cover;">` : `<div style="width:60px; height:60px; border-radius:50%; background:#F0EBFA; display:flex; align-items:center; justify-content:center; font-weight:700; color:var(--purple); font-size:22px;">${driverProfile.name.charAt(0)}</div>`}
      <div>
        <div style="font-weight:700; font-size:16px;">${driverProfile.name}</div>
        <div style="font-size:13px; color:#888; margin-top:2px;">${driverProfile.phone}</div>
        <div style="font-size:13px; color:#888;">${driverProfile.vehicle} · ${driverProfile.vehicleType}</div>
        <div style="margin-top:6px;">${isVerified() ? '<span class="pass-badge pass-active">Verified</span>' : '<span class="pass-badge pass-expired">Not Verified</span>'}</div>
      </div>
    </div>

    <div class="card tight">
      <div style="font-weight:700;">Daily Pass — ₹${PASS_AMOUNT}/24hr</div>
      <div style="font-size:13px; color:#888; margin:6px 0 12px;">${passInfo}</div>
      <div class="qr-box"><img src="${qrUrl}" alt="UPI QR Code"></div>
      <div class="upi-id-box">${UPI_ID}</div>
      <label>UPI Transaction Reference (after paying)</label>
      <input id="txnRef" type="text" placeholder="e.g. 123456789012">
      <button class="pill-btn btn-purple" style="margin-top:12px;" id="btnSubmitRecharge">Submit for Verification</button>
      <div style="font-size:12px; color:#999; margin-top:8px; text-align:center;">We'll confirm and activate your pass shortly after payment.</div>
    </div>

    <div class="card tight">
      <button class="pill-btn btn-outline" id="btnInstallMenu">📲 Install App</button>
      <button class="pill-btn btn-flat" style="margin-top:10px;" id="btnShareMenu">🔗 Share App</button>
      <div id="iosInstallNote"></div>
    </div>

    <div class="card tight">
      <button class="pill-btn btn-flat" id="btnLogoutDriver">Logout</button>
    </div>

    <div class="credit-line">GOGUWAHATI by Marak Innovation</div>
  `;

  document.getElementById('btnLogoutDriver').addEventListener('click', () => {
    if (confirm('Logout of your driver account?')) auth.signOut();
  });

  document.getElementById('btnSubmitRecharge').addEventListener('click', () => {
    const txn = document.getElementById('txnRef').value.trim();
    if (!txn) { alert('Please enter your transaction reference.'); return; }
    db.ref('rechargeRequests').push({
      driverId, driverName: driverProfile.name, driverPhone: driverProfile.phone,
      amount: PASS_AMOUNT, txnRef: txn, status: 'pending', submittedAt: Date.now()
    }).then(() => {
      alert('Submitted! Your pass will be activated once payment is confirmed.');
      document.getElementById('txnRef').value = '';
    });
  });

  setupInstallShare('btnInstallMenu', 'btnShareMenu', 'iosInstallNote');
}

// ================= INSTALL / SHARE =================
let deferredInstallPrompt = null;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredInstallPrompt = e;
});

function isIOS() {
  return /iPad|iPhone|iPod/.test(navigator.userAgent);
}

function setupInstallShare(installBtnId, shareBtnId, noteId) {
  const installBtn = document.getElementById(installBtnId);
  const shareBtn = document.getElementById(shareBtnId);
  const note = document.getElementById(noteId);

  if (isIOS()) {
    if (installBtn) installBtn.style.display = 'none';
    if (note) note.innerHTML = `<div style="font-size:12px; color:#888; margin-top:10px; text-align:center;">On iPhone: tap the Share icon in Safari, then "Add to Home Screen" to install.</div>`;
  } else if (installBtn) {
    installBtn.addEventListener('click', async () => {
      if (deferredInstallPrompt) {
        deferredInstallPrompt.prompt();
        await deferredInstallPrompt.userChoice;
        deferredInstallPrompt = null;
      } else {
        alert('App may already be installed, or your browser does not support one-tap install. Use the browser menu to Add to Home screen.');
      }
    });
  }

  if (shareBtn) {
    shareBtn.addEventListener('click', () => {
      const shareData = { title: 'GOGUWAHATI Driver', text: 'Drive with GOGUWAHATI — join now!', url: window.location.href };
      if (navigator.share) {
        navigator.share(shareData).catch(() => {});
      } else {
        navigator.clipboard.writeText(window.location.href);
        alert('Link copied to clipboard!');
      }
    });
  }
}
